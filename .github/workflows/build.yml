name: Build embeddable CoMaps

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if this upstream version already has a release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  # Official CoMaps release signing cert (from the comaps README)
  UPSTREAM_SHA256: "4894e8e6963627ef660031d8593fe77297f835acb4e23810003e926135023b4c"
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find latest upstream release (Codeberg)
        id: up
        run: |
          set -euo pipefail
          json=$(curl -fsSL https://codeberg.org/api/v1/repos/comaps/comaps/releases/latest)
          tag=$(jq -r .tag_name <<<"$json")
          echo "Upstream tag: $tag"
          echo "Assets:"; jq -r '.assets[].name' <<<"$json"
          url=$(jq -r '[.assets[] | select(.name|endswith(".apk"))
                 | select(.name|test("release";"i"))
                 | select(.name|test("fdroid|debug|test";"i")|not)][0].browser_download_url // empty' <<<"$json")
          if [ -z "$url" ]; then
            echo "::error::No suitable .apk asset found. Adjust the filter above."; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Skip if already released
        id: exists
        run: |
          if gh release view "${{ steps.up.outputs.tag }}-embed" >/dev/null 2>&1 \
             && [ "${{ inputs.force }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Already built."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download and verify upstream APK
        if: steps.exists.outputs.skip == 'false'
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          echo "BT=$BT" >> "$GITHUB_ENV"
          curl -fsSL -o upstream.apk "${{ steps.up.outputs.url }}"
          "$BT/apksigner" verify --print-certs upstream.apk | tee certs.txt
          got=$(grep -i 'certificate SHA-256 digest' certs.txt | head -1 | awk '{print $NF}' | tr 'A-F' 'a-f')
          if [ "$got" != "$UPSTREAM_SHA256" ]; then
            echo "::error::Upstream signature mismatch ($got). Refusing to repackage."; exit 1
          fi

      - name: Patch manifest directly (no apktool)
        if: steps.exists.outputs.skip == 'false'
        run: |
          set -euo pipefail
          JAR="$(ls -d "$ANDROID_HOME"/platforms/android-[0-9]* | sort -V | tail -n1)/android.jar"
          echo "android.jar: $JAR"
          python3 -I scripts/patch_apk.py upstream.apk unsigned.apk report.json "$JAR"

      - name: Align and sign
        if: steps.exists.outputs.skip == 'false'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$BT/zipalign" -p -f 4 unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --out final.apk aligned.apk
          rm -f "$RUNNER_TEMP/release.jks"
          "$BT/apksigner" verify --print-certs final.apk

      - name: Verify result
        if: steps.exists.outputs.skip == 'false'
        run: |
          set -euo pipefail
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml final.apk > tree.txt
          grep -c 'allowUntrustedActivityEmbedding' tree.txt
          grep -q 'allowUntrustedActivityEmbedding' tree.txt
          "$BT/aapt2" dump badging final.apk | grep -E "^package:|^targetSdkVersion|launchable-activity" | tee badging.txt
          grep -E 'launchMode|allowUntrustedActivityEmbedding' tree.txt | tee flags.txt

      - name: Publish release
        if: steps.exists.outputs.skip == 'false'
        run: |
          set -euo pipefail
          TAG="${{ steps.up.outputs.tag }}"
          cp final.apk "CoMaps-embed-${TAG}.apk"
          {
            echo "Upstream CoMaps ${TAG}, repackaged (binary manifest edit, no apktool)."
            echo; echo '```json'; cat report.json; echo '```'
            echo; echo '```'; cat badging.txt; echo; cat flags.txt; echo '```'
            echo; echo "Signed with this repo's key, NOT the official one."
          } > notes.md
          gh release delete "${TAG}-embed" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${TAG}-embed" "CoMaps-embed-${TAG}.apk" \
            --title "CoMaps ${TAG} (embeddable)" --notes-file notes.md
