name: Make keystore (run once)

on:
  workflow_dispatch:

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate keystore and print values
        run: |
          set -euo pipefail
          PASS=$(head -c 200 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 24)
          keytool -genkeypair -keystore release.jks -alias comaps \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=CoMaps Embed, O=Personal, C=MY"
          B64=$(base64 -w0 release.jks)
          {
            echo "## Copy these 4 values into repo Secrets"
            echo
            echo "**KEYSTORE_PASSWORD**"
            echo '```'; echo "$PASS"; echo '```'
            echo "**KEY_PASSWORD**"
            echo '```'; echo "$PASS"; echo '```'
            echo "**KEY_ALIAS**"
            echo '```'; echo "comaps"; echo '```'
            echo "**KEYSTORE_BASE64**"
            echo '```'; echo "$B64"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
